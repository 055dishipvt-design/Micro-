function fl(el,txt){var r=el.getBoundingClientRect(),t=$('s1').getBoundingClientRect(),s=document.createElement('div');s.className='fl';s.textContent=txt;s.style.left=(r.left+r.width/2)+'px';s.style.top=r.top+'px';document.body.appendChild(s);requestAnimationFrame(function(){requestAnimationFrame(function(){s.style.left=(t.left+t.width/2)+'px';s.style.top=Math.max(t.top,20)+'px';s.style.opacity=0;s.style.transform='translate(-50%,0) scale(.6)'})});setTimeout(function(){s.remove();var b=$('s1');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')},900)}
